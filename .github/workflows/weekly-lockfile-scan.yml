name: Weekly lockfile vulnerability scan

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    name: Scan lockfile for new vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan lockfile for known vulnerable versions
        run: node scripts/check-vulnerable-deps.mjs

      - name: Open issue on failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.runId;
            const repo = context.repo;
            const url = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run}`;
            await github.rest.issues.create({
              owner: repo.owner,
              repo: repo.repo,
              title: 'Weekly lockfile scan found a fixable vulnerability',
              body: `The scheduled lockfile vulnerability scan failed — a package has a known vulnerable version with a fix available.\n\nSee the failing run: ${url}\n\nUpdate the package and re-run the workflow to confirm the fix.`,
              labels: ['security', 'lockfile-scan'],
            });
